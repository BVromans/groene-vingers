record_outdoor_irrigation_event:
  alias: Record Outdoor Irrigation Event
  mode: queued
  max: 2

  fields:
    zone_id:
      description: Stable irrigation zone identifier.
    location:
      description: Physical location of the irrigation zone.
    tap_entity:
      description: LinkTap switch entity that represents the watering run.
    volume_entity:
      description: LinkTap session-volume sensor entity.
    plant_slots:
      description: Stable plant slots measured by this zone event.
    plant_entities:
      description: Canonical moisture entities measured by this zone event.
    before_entities:
      description: Persistent per-slot moisture-before helper entities.

  sequence:
    - variables:
        started_at: "{{ now().timestamp() }}"
        zone_label: "{{ 'Zone 1' if zone_id == 'zone_1' else 'Zone 2' }}"
        before: >
          {% set ns = namespace(total=0, count=0) %}
          {% for entity_id in plant_entities %}
            {% set value = states(entity_id) %}
            {% if value not in ['unknown', 'unavailable', 'none', ''] and is_number(value) %}
              {% set ns.total = ns.total + (value | float) %}
              {% set ns.count = ns.count + 1 %}
            {% endif %}
          {% endfor %}
          {{ (ns.total / ns.count) | round(1) if ns.count == (plant_entities | count) and ns.count > 0 else 'unknown' }}
        before_valid: >
          {% set ns = namespace(valid=0) %}
          {% for entity_id in plant_entities %}
            {% set value = states(entity_id) %}
            {% if value not in ['unknown', 'unavailable', 'none', ''] and is_number(value) %}
              {% set ns.valid = ns.valid + 1 %}
            {% endif %}
          {% endfor %}
          {{ ns.valid == (plant_entities | count) and ns.valid > 0 }}

    - choose:
        - conditions: "{{ not before_valid }}"
          sequence:
            - service: persistent_notification.create
              data:
                title: "Outdoor Irrigation Event Rejected"
                message: >
                  Zone {{ zone_id }} ({{ location }}) was not logged because one
                  or more monitored moisture sensors were unavailable or invalid
                  before watering. Slots: {{ plant_slots | join(', ') }}.
            - stop: "Invalid moisture-before measurement"

    - service: persistent_notification.create
      data:
        title: "Outdoor Irrigation Started"
        message: >
          Zone: {{ zone_id }} ({{ location }})

          Plant slots: {{ plant_slots | join(', ') }}

          Moisture before: {{ before }}%

          Timestamp: {{ now().strftime('%Y-%m-%d %H:%M:%S') }}

    - repeat:
        for_each: "{{ plant_entities }}"
        sequence:
          - service: input_number.set_value
            target:
              entity_id: "{{ before_entities[repeat.index - 1] }}"
            data:
              value: "{{ states(repeat.item) | float }}"

    - choose:
        - conditions: "{{ zone_id == 'zone_1' }}"
          sequence:
            - service: input_number.set_value
              target:
                entity_id: input_number.zone_1_moisture_before
              data:
                value: "{{ before }}"
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.zone_1_learning_pending
        - conditions: "{{ zone_id == 'zone_2' }}"
          sequence:
            - service: input_number.set_value
              target:
                entity_id: input_number.zone_2_moisture_before
              data:
                value: "{{ before }}"
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.zone_2_learning_pending

    - wait_template: "{{ is_state(tap_entity, 'off') }}"

    - variables:
        runtime_minutes: "{{ ((now().timestamp() - started_at) / 60) | round(1) }}"
        volume: "{{ states(volume_entity) | float(0) }}"

    - choose:
        - conditions: "{{ zone_id == 'zone_1' }}"
          sequence:
            - service: input_number.set_value
              target:
                entity_id: input_number.zone_1_last_runtime
              data:
                value: "{{ runtime_minutes }}"
            - service: input_number.set_value
              target:
                entity_id: input_number.zone_1_last_volume
              data:
                value: "{{ volume }}"
        - conditions: "{{ zone_id == 'zone_2' }}"
          sequence:
            - service: input_number.set_value
              target:
                entity_id: input_number.zone_2_last_runtime
              data:
                value: "{{ runtime_minutes }}"
            - service: input_number.set_value
              target:
                entity_id: input_number.zone_2_last_volume
              data:
                value: "{{ volume }}"

    - choose:
        - conditions: "{{ zone_id == 'zone_1' }}"
          sequence:
            - service: input_number.set_value
              target:
                entity_id: input_number.zone_1_stopped_timestamp
              data:
                value: "{{ now().timestamp() }}"
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.zone_1_learning_pending
        - conditions: "{{ zone_id == 'zone_2' }}"
          sequence:
            - service: input_number.set_value
              target:
                entity_id: input_number.zone_2_stopped_timestamp
              data:
                value: "{{ now().timestamp() }}"
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.zone_2_learning_pending

    - service: persistent_notification.create
      data:
        title: "Outdoor Irrigation Runtime Captured"
        message: >
          Zone: {{ zone_id }} ({{ location }})

          Runtime: {{ runtime_minutes }} min

          Reported volume: {{ volume }} L (untrusted until calibrated)

          Waiting 45 minutes for soil stabilization. The event is persisted and
          can survive a Home Assistant restart.

    - stop: "Event persisted; completion is handled by the recovery-safe automation"

record_outdoor_irrigation_completion:
  alias: Complete Outdoor Irrigation Event
  mode: queued
  max: 2

  fields:
    zone_id:
      description: Stable irrigation zone identifier.
    location:
      description: Physical location of the irrigation zone.
    plant_slots:
      description: Stable plant slots measured by this zone event.
    plant_entities:
      description: Canonical moisture entities measured by this zone event.
    before_entities:
      description: Persistent per-slot moisture-before helper entities.
    before_entity:
      description: Persisted moisture-before helper entity.
    runtime_entity:
      description: Persisted runtime helper entity.
    volume_entity:
      description: Persisted reported-volume helper entity.
    delta_entity:
      description: Persisted delta helper entity.
    stopped_timestamp_entity:
      description: Persisted stop timestamp helper entity.
    pending_entity:
      description: Persistent pending-learning flag.

  sequence:
    - variables:
        zone_label: "{{ 'Zone 1' if zone_id == 'zone_1' else 'Zone 2' }}"
        event_id: "{{ zone_id }}_{{ states(stopped_timestamp_entity) | int(0) }}"
        completed_at: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        before: "{{ states(before_entity) | float(0) }}"
        runtime_minutes: "{{ states(runtime_entity) | float(0) }}"
        volume: "{{ states(volume_entity) | float(0) }}"
        after: >
          {% set ns = namespace(total=0, count=0) %}
          {% for entity_id in plant_entities %}
            {% set value = states(entity_id) %}
            {% if value not in ['unknown', 'unavailable', 'none', ''] and is_number(value) %}
              {% set ns.total = ns.total + (value | float) %}
              {% set ns.count = ns.count + 1 %}
            {% endif %}
          {% endfor %}
          {{ (ns.total / ns.count) | round(1) if ns.count == (plant_entities | count) and ns.count > 0 else 'unknown' }}
        after_valid: >
          {% set ns = namespace(valid=0) %}
          {% for entity_id in plant_entities %}
            {% set value = states(entity_id) %}
            {% if value not in ['unknown', 'unavailable', 'none', ''] and is_number(value) %}
              {% set ns.valid = ns.valid + 1 %}
            {% endif %}
          {% endfor %}
          {{ ns.valid == (plant_entities | count) and ns.valid > 0 }}
        delta: "{{ (after - before) | round(1) if after_valid else 'unknown' }}"

    - choose:
        - conditions: "{{ not after_valid }}"
          sequence:
            - service: persistent_notification.create
              data:
                title: "Outdoor Irrigation Event Incomplete"
                message: >
                  Zone {{ zone_id }} ({{ location }}) is ready for completion,
                  but one or more after measurements are unavailable or invalid.
                  The event remains pending for a later retry.
            - stop: "Invalid moisture-after measurement"

    - service: input_number.set_value
      target:
        entity_id: "{{ delta_entity }}"
      data:
        value: "{{ delta }}"

    - service: shell_command.append_outdoor_learning_log
      data:
        line: >
          {{ completed_at }},
          {{ zone_label }},
          {{ before }},
          {{ after }},
          {{ delta }},
          {{ runtime_minutes }},
          {{ volume }}

    - repeat:
        for_each: "{{ plant_slots }}"
        sequence:
          - variables:
              plant_slot: "{{ repeat.item }}"
              moisture_entity: "{{ plant_entities[repeat.index - 1] }}"
              sensor_before: "{{ states(before_entities[repeat.index - 1]) | float(0) }}"
              sensor_after: "{{ states(plant_entities[repeat.index - 1]) | float(0) }}"
              sensor_delta: "{{ (sensor_after - sensor_before) | round(1) }}"
          - service: shell_command.append_outdoor_sensor_learning_log
            data:
              line: >
                {{ completed_at }},
                {{ event_id }},
                {{ zone_id }},
                {{ plant_slot }},
                {{ moisture_entity }},
                {{ sensor_before }},
                {{ sensor_after }},
                {{ sensor_delta }},
                {{ runtime_minutes }},
                {{ volume }},
                untrusted_until_calibrated

    - service: input_boolean.turn_off
      target:
        entity_id: "{{ pending_entity }}"

    - service: persistent_notification.create
      data:
        title: "Outdoor Irrigation Event Complete"
        message: >
          Zone: {{ zone_id }} ({{ location }})

          Plant slots: {{ plant_slots | join(', ') }}

          Before: {{ before }}%

          After: {{ after }}%

          Delta: {{ delta }}%

          Runtime: {{ runtime_minutes }} min

          Reported volume: {{ volume }} L (untrusted until calibrated)

start_tuin_irrigatie:
  alias: Start Tuin Irrigatie

  sequence:

    - action: linktap.start_watering

      target:
        entity_id:
          valve.taplinker_tuin_linktap_taplinker_1

      data:
        seconds: >
          {{
            states(
              'input_number.tuin_runtime_minuten'
            ) | int * 60
          }}

start_balkon_irrigatie:
  alias: Start Balkon Irrigatie

  sequence:

    - action: linktap.start_watering

      target:
        entity_id:
          valve.taplinker_balkon_linktap_taplinker_2

      data:
        seconds: >
          {{
            states(
              'input_number.balkon_runtime_minuten'
            ) | int * 60
          }}
