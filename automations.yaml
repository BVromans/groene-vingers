# =========================
# WATER LOGGING
# =========================

- id: log_plant_1_water
  alias: Log Plant 1 Water

  trigger:
    - platform: state
      entity_id: input_button.log_plant_1_water

  action:
    - service: input_number.set_value
      target:
        entity_id: input_number.plant_1_moisture_before
      data:
        value: "{{ states('sensor.plant_1_moisture_delayed') | float(0) }}"

    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.plant_1_waiting_for_delta

    - service: persistent_notification.create
      data:
        title: "Plant Water Logged"

        message: >
          Plant:
          {{ states('input_text.plant_1_name') }}

          Moisture Before:
          {{ states('sensor.plant_1_moisture_delayed') }}%

          Water:
          {{ states('input_number.plant_water_amount') }} ml

          Method:
          {{ states('input_select.plant_water_method') }}

          Time:
          {{ now().strftime('%Y-%m-%d %H:%M:%S') }}

