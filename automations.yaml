# =========================
# LINKTAP STARTUP HEALTH CHECK
# =========================

- id: linktap_startup_health_check
  alias: LinkTap Startup Health Check

  trigger:
    - platform: homeassistant
      event: start

  action:
    - delay:
        seconds: 60

    - condition: template
      value_template: "{{ not has_service('linktap', 'start_watering') }}"

    - service: persistent_notification.create
      data:
        title: "LinkTap Service Unavailable"
        message: >
          De LinkTap service `linktap.start_watering` is niet beschikbaar na HA-start.
          Controleer of de LinkTap controller online is en reload/restart de integratie.

# =========================
# PLANT WATERING NOTIFICATIONS
# =========================

- id: plant_watering_alert
  alias: Plant Watering Alert (dashboard color change)
  mode: parallel

  trigger:
    - platform: template
      id: "1_orange"
      value_template: >
        {% set m = states('sensor.plant_1_moisture') | float(0) %}
        {% set t = states('input_number.plant_1_target_moisture') | float(0) %}
