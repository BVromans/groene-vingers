# =========================
# OUTDOOR WATER LEARNING
# =========================

# ==========================================
# ZONE 1 - TUIN
# ==========================================

- id: outdoor_zone_1_learning
  alias: Outdoor Zone 1 Learning

  trigger:
    - platform: state
      entity_id: switch.taplinker_tuin_linktap_taplinker_1
      to: "on"

  action:

    # ==========================================
    # STORE START VALUES
    # ==========================================

    - service: input_number.set_value
      target:
        entity_id: input_number.zone_1_start_timestamp
      data:
        value: "{{ now().timestamp() }}"

    - service: input_number.set_value
      target:
        entity_id: input_number.zone_1_moisture_before
      data:
        value: "{{ states('sensor.plant_4_moisture') | float(0) }}"

    - service: persistent_notification.create
      data:
        title: "Zone 1 Learning Started"

        message: >
          Zone: Tuin

          Start Moisture:
          {{ states('sensor.plant_4_moisture') }}%

          Timestamp:
          {{ now().strftime('%Y-%m-%d %H:%M:%S') }}

    # ==========================================
    # WAIT FOR STOP
    # ==========================================

    - wait_for_trigger:

        - platform: state
          entity_id: switch.taplinker_tuin_linktap_taplinker_1
          to: "off"

    # ==========================================
    # CALCULATE RUNTIME
    # ==========================================

    - variables:

        start_ts: >
          {{ states('input_number.zone_1_start_timestamp') | float(0) }}

        runtime_minutes: >
          {{ ((now().timestamp() - start_ts) / 60) | round(1) }}

        volume: >
          {{ states('sensor.taplinker_tuin_linktap_taplinker_1_volume') | float(0) }}

    - service: persistent_notification.create
      data:
        title: "Zone 1 Runtime Captured"

        message: >
          Runtime:
          {{ runtime_minutes }} min

          Volume:
          {{ volume }} L

          Waiting 45 minutes for soil stabilization...

    # ==========================================
    # WAIT FOR INFILTRATION
    # ==========================================

    - delay:
        minutes: 45

    # ==========================================
    # FINAL MEASUREMENT
    # ==========================================

    - variables:

        before: >
          {{ states('input_number.zone_1_moisture_before') | float(0) }}

        after: >
          {{ states('sensor.plant_4_moisture') | float(0) }}

        delta: >
          {{ (after - before) | round(1) }}

    # ==========================================
    # COMPLETE NOTIFICATION
    # ==========================================

    - service: persistent_notification.create
      data:
        title: "Outdoor Zone 1 Learning Complete"

        message: >
          Zone: Tuin

          Before:
          {{ before }}%

          After:
          {{ after }}%

          Delta:
          {{ delta }}%

          Runtime:
          {{ runtime_minutes }} min

          Volume:
          {{ volume }} L

    # ==========================================
    # CSV LOGGING
    # ==========================================

    - service: shell_command.append_outdoor_learning_log
      data:
        line: >
          {{ now().strftime('%Y-%m-%d %H:%M:%S') }},
          Zone 1,
          {{ before }},
          {{ after }},
          {{ delta }},
          {{ runtime_minutes }},
          {{ volume }}

