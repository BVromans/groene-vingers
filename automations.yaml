# =========================
# DELTA MEASUREMENTS
# =========================

- id: plant_1_measure_delta
  alias: Plant 1 Measure Delta

  trigger:
    - platform: state
      entity_id: input_boolean.plant_1_waiting_for_delta
      to: "on"
      for:
        minutes: 30

  action:
    - variables:
        before: "{{ states('input_number.plant_1_moisture_before') | float(0) }}"
        after: "{{ states('sensor.plant_1_moisture') | float(0) }}"
        delta: "{{ (after - before) | round(1) }}"

    - service: persistent_notification.create
      data:
        title: "Plant Learning Result"

        message: >
          Plant:
          {{ states('input_text.plant_1_name') }}

          Before:
          {{ before }}%

          After:
          {{ after }}%

          Delta:
          {{ delta }}%

          Water:
          {{ states('input_number.plant_water_amount') }} ml

          Method:
          {{ states('input_select.plant_water_method') }}

    - service: input_number.set_value
      target:
        entity_id: input_number.plant_1_last_delta
      data:
        value: "{{ delta }}"

    - service: input_number.set_value
      target:
        entity_id: input_number.plant_1_last_water
      data:
        value: "{{ states('input_number.plant_water_amount') }}"

    - service: shell_command.append_water_learning_log
      data:
        line: >
          {{ now().strftime('%Y-%m-%d %H:%M:%S') }},
          {{ states('input_text.plant_1_name') }},
          {{ before }},
          {{ after }},
          {{ delta }},
          {{ states('input_number.plant_water_amount') }},
          {{ states('input_select.plant_water_method') }}

    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.plant_1_waiting_for_delta

