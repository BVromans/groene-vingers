# =========================
# LEARNING RECOVERY (STUCK WAITING)
# =========================

- id: plant_learning_recovery_stuck_waiting
  alias: Plant Learning Recovery Stuck Waiting

  trigger:
    - platform: time_pattern
      minutes: "/5"

  action:
    - choose:
        - conditions:
            - condition: template
              value_template: >
                {{
                  is_state('input_boolean.plant_1_waiting_for_delta', 'on')
                  and
                  (
                    as_timestamp(now())
                    -
                    as_timestamp(states.input_boolean.plant_1_waiting_for_delta.last_changed, 0)
                  ) > 2400
                }}
          sequence:
            - variables:
                before: "{{ states('input_number.plant_1_moisture_before') | float(0) }}"
                after: "{{ states('sensor.plant_1_moisture') | float(0) }}"
                delta: "{{ (after - before) | round(1) }}"

