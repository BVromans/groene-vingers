# =========================
# OUTDOOR WATER LEARNING
# =========================

# ==========================================
# ZONE 1 - TUIN
# ==========================================

- id: outdoor_zone_1_learning
  alias: Outdoor Zone 1 Learning

  trigger:
    - platform: state
      entity_id: switch.taplinker_tuin_linktap_taplinker_1
      to: "on"

  action:

    - service: script.record_outdoor_irrigation_event
      data:
        zone_id: zone_1
        location: Tuin
        tap_entity: switch.taplinker_tuin_linktap_taplinker_1
        volume_entity: sensor.taplinker_tuin_linktap_taplinker_1_volume
        plant_slots:
          - plant_4
          - plant_5
          - plant_8
          - plant_9
        plant_entities:
          - sensor.plant_4_moisture
          - sensor.plant_5_moisture
          - sensor.plant_8_moisture
          - sensor.plant_9_moisture
        before_entities:
          - input_number.zone_1_plant_4_moisture_before
          - input_number.zone_1_plant_5_moisture_before
          - input_number.zone_1_plant_8_moisture_before
          - input_number.zone_1_plant_9_moisture_before

    - stop: "Handled by shared outdoor irrigation event script"

# ==========================================
# ZONE 2 - BALKON
# ==========================================

- id: outdoor_zone_2_learning
  alias: Outdoor Zone 2 Learning

  trigger:
    - platform: state
      entity_id: switch.taplinker_balkon_linktap_taplinker_2
      to: "on"

  action:

    - service: script.record_outdoor_irrigation_event
      data:
        zone_id: zone_2
        location: Balkon
        tap_entity: switch.taplinker_balkon_linktap_taplinker_2
        volume_entity: sensor.taplinker_balkon_linktap_taplinker_2_volume
        plant_slots:
          - plant_6
          - plant_7
        plant_entities:
          - sensor.plant_6_moisture
          - sensor.plant_7_moisture
        before_entities:
          - input_number.zone_2_plant_6_moisture_before
          - input_number.zone_2_plant_7_moisture_before

    - stop: "Handled by shared outdoor irrigation event script"

- id: outdoor_learning_resume_after_restart
  alias: Outdoor Learning Resume After Restart
  mode: single

  trigger:
    - platform: time_pattern
      minutes: "/1"

  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.zone_1_learning_pending
              state: "on"
            - condition: template
              value_template: >
                {{
                  (now().timestamp()
                  - states('input_number.zone_1_stopped_timestamp') | float(0)) >= 2700
                }}
            - condition: template
              value_template: >
                {{
                  states('sensor.plant_4_moisture') not in ['unknown', 'unavailable']
                  and states('sensor.plant_5_moisture') not in ['unknown', 'unavailable']
                  and states('sensor.plant_8_moisture') not in ['unknown', 'unavailable']
                  and states('sensor.plant_9_moisture') not in ['unknown', 'unavailable']
                }}
          sequence:
            - service: script.record_outdoor_irrigation_completion
              data:
                zone_id: zone_1
                location: Tuin
                plant_slots:
                  - plant_4
                  - plant_5
                  - plant_8
                  - plant_9
                plant_entities:
                  - sensor.plant_4_moisture
                  - sensor.plant_5_moisture
                  - sensor.plant_8_moisture
                  - sensor.plant_9_moisture
                before_entities:
                  - input_number.zone_1_plant_4_moisture_before
                  - input_number.zone_1_plant_5_moisture_before
                  - input_number.zone_1_plant_8_moisture_before
                  - input_number.zone_1_plant_9_moisture_before
                before_entity: input_number.zone_1_moisture_before
                runtime_entity: input_number.zone_1_last_runtime
                volume_entity: input_number.zone_1_last_volume
                delta_entity: input_number.zone_1_last_delta
                stopped_timestamp_entity: input_number.zone_1_stopped_timestamp
                pending_entity: input_boolean.zone_1_learning_pending

        - conditions:
            - condition: state
              entity_id: input_boolean.zone_2_learning_pending
              state: "on"
            - condition: template
              value_template: >
                {{
                  (now().timestamp()
                  - states('input_number.zone_2_stopped_timestamp') | float(0)) >= 2700
                }}
            - condition: template
              value_template: >
                {{
                  states('sensor.plant_6_moisture') not in ['unknown', 'unavailable']
                  and states('sensor.plant_7_moisture') not in ['unknown', 'unavailable']
                }}
          sequence:
            - service: script.record_outdoor_irrigation_completion
              data:
                zone_id: zone_2
                location: Balkon
                plant_slots:
                  - plant_6
                  - plant_7
                plant_entities:
                  - sensor.plant_6_moisture
                  - sensor.plant_7_moisture
                before_entities:
                  - input_number.zone_2_plant_6_moisture_before
                  - input_number.zone_2_plant_7_moisture_before
                before_entity: input_number.zone_2_moisture_before
                runtime_entity: input_number.zone_2_last_runtime
                volume_entity: input_number.zone_2_last_volume
                delta_entity: input_number.zone_2_last_delta
                stopped_timestamp_entity: input_number.zone_2_stopped_timestamp
                pending_entity: input_boolean.zone_2_learning_pending

# =========================
# LINKTAP STARTUP HEALTH CHECK
# =========================

- id: linktap_startup_health_check
  alias: LinkTap Startup Health Check

  trigger:
    - platform: homeassistant
      event: start

  action:
    - delay:
        seconds: 60

    - condition: template
      value_template: "{{ not has_service('linktap', 'start_watering') }}"

    - service: persistent_notification.create
      data:
        title: "LinkTap Service Unavailable"
        message: >
          De LinkTap service `linktap.start_watering` is niet beschikbaar na HA-start.
          Controleer of de LinkTap controller online is en reload/restart de integratie.

