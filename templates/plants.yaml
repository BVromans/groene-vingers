    # ==========================================
    # ZONE 1 RUNTIME RECOMMENDATION
    # ==========================================

    - name: Zone 1 Runtime Recommendation

      unique_id: zone_1_runtime_recommendation

      state: >
        {% set p4 = states('sensor.template_plant_4_priority') %}
        {% set p5 = states('sensor.template_plant_5_priority') %}
        {% set p8 = states('sensor.template_plant_8_priority') %}

        {% set d4 = states('sensor.sensor_4_dryback') %}
        {% set d5 = states('sensor.sensor_5_dryback') %}
        {% set d8 = states('sensor.sensor_8_dryback') %}

        {% set recommendations_enabled =
          is_state('input_boolean.runtime_recommendations_enabled', 'on')
        %}
        {% set rain_enabled =
          is_state('input_boolean.rain_suppression_enabled', 'on')
        %}
        {% set priorities = [p4, p5, p8] %}
        {% set rain =
          states('sensor.irrigation_rain_advisory')
        %}
        {% set weather =
          states('sensor.weather_stress_level')
        %}
        {% set drybacks = [d4, d5, d8] %}

        {% if not recommendations_enabled %}
          manual_mode

        {% elif rain_enabled and rain == 'skip_irrigation' %}
          skip_rain

        {% elif rain_enabled and rain == 'reduce_runtime' %}
          {% if 'critical' in priorities and 'fast' in drybacks %}
            12 min

          {% elif 'critical' in priorities %}
            8 min

          {% elif 'dry' in priorities and 'fast' in drybacks %}
            6 min

          {% elif 'dry' in priorities and weather == 'high' %}
            8 min

          {% elif 'dry' in priorities and weather == 'medium' %}
            6 min

          {% elif 'dry' in priorities %}
            6 min

          {% elif 'wet' in priorities %}
            skip

          {% else %}
            monitor
          {% endif %}

        {% elif rain == 'monitor_weather' %}
          {% if 'critical' in priorities and 'fast' in drybacks %}
            12 min

          {% elif 'critical' in priorities %}
            10 min

          {% elif 'dry' in priorities and 'fast' in drybacks %}
            8 min

          {% elif 'dry' in priorities and weather == 'high' %}
            10 min

          {% elif 'dry' in priorities and weather == 'medium' %}
            8 min

          {% elif 'dry' in priorities %}
            6 min

          {% elif 'wet' in priorities %}
            skip

          {% else %}
            monitor
          {% endif %}

        {% elif 'critical' in priorities and 'fast' in drybacks %}
          15 min

        {% elif 'critical' in priorities %}
          12 min

        {% elif 'dry' in priorities and 'fast' in drybacks %}
          10 min

        {% elif 'dry' in priorities and weather == 'high' %}
          12 min

        {% elif 'dry' in priorities and weather == 'medium' %}
          10 min

        {% elif 'dry' in priorities %}
          8 min

        {% elif 'wet' in priorities %}
          skip

        {% else %}
          monitor
        {% endif %}

    # ==========================================
    # ZONE 2 RUNTIME RECOMMENDATION
    # ==========================================

    - name: Zone 2 Runtime Recommendation

      unique_id: zone_2_runtime_recommendation

      state: >
        {% set p6 = states('sensor.template_plant_6_priority') %}
        {% set p7 = states('sensor.template_plant_7_priority') %}

        {% set d6 = states('sensor.sensor_6_dryback') %}
        {% set d7 = states('sensor.sensor_7_dryback') %}

        {% set recommendations_enabled =
          is_state('input_boolean.runtime_recommendations_enabled', 'on')
        %}
        {% set rain_enabled =
          is_state('input_boolean.rain_suppression_enabled', 'on')
        %}
        {% set priorities = [p6, p7] %}
        {% set rain =
          states('sensor.irrigation_rain_advisory')
        %}
        {% set weather =
          states('sensor.weather_stress_level')
        %}
        {% set drybacks = [d6, d7] %}

        {% if not recommendations_enabled %}
          manual_mode

        {% elif rain_enabled and rain == 'reduce_runtime' %}
          {% if 'critical' in priorities and 'fast' in drybacks %}
            10 min

          {% elif 'critical' in priorities %}
            8 min

          {% elif 'dry' in priorities and 'fast' in drybacks %}
            6 min

          {% elif 'dry' in priorities and weather == 'high' %}
            6 min

          {% elif 'dry' in priorities and weather == 'medium' %}
            4 min

          {% elif 'dry' in priorities %}
            4 min

          {% elif 'wet' in priorities %}
            skip

          {% else %}
            monitor
          {% endif %}

        {% elif rain == 'monitor_weather' %}
          {% if 'critical' in priorities and 'fast' in drybacks %}
            11 min

          {% elif 'critical' in priorities %}
            9 min

          {% elif 'dry' in priorities and 'fast' in drybacks %}
            7 min

          {% elif 'dry' in priorities and weather == 'high' %}
            7 min

          {% elif 'dry' in priorities and weather == 'medium' %}
            5 min

          {% elif 'dry' in priorities %}
            4 min

          {% elif 'wet' in priorities %}
            skip

          {% else %}
            monitor
          {% endif %}

        {% elif 'critical' in priorities and 'fast' in drybacks %}
          12 min

        {% elif 'critical' in priorities %}
          10 min

        {% elif 'dry' in priorities and 'fast' in drybacks %}
          8 min

        {% elif 'dry' in priorities and weather == 'high' %}
          8 min

        {% elif 'dry' in priorities and weather == 'medium' %}
          6 min

        {% elif 'dry' in priorities %}
          5 min

        {% elif 'wet' in priorities %}
          skip

        {% else %}
          monitor
        {% endif %}

