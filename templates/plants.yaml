    # ==========================================

    - name: Zone 1 Gezondheidsscore

      unique_id: zone_1_health_score

      unit_of_measurement: "%"

      state: >

        {% set score = 100 %}

        {% set confidence =
          states('sensor.zone_1_recommendation_confidence')
        %}

        {% set anomaly =
          states('sensor.zone_1_monitor_afwijkingen')
        %}

        {% set efficiency =
          states('sensor.zone_1_irrigation_efficiency') | float(0)
        %}

        {% set dryback =
          states('sensor.zone_1_dryback_speed')
        %}

        {% set demand =
          states('sensor.zone_1_water_demand')
        %}

        {# Confidence #}
        {% if confidence == 'medium' %}
          {% set score = score - 10 %}
        {% elif confidence != 'high' %}
          {% set score = score - 20 %}
        {% endif %}

        {# Anomalies #}
        {% if anomaly == 'waarschuwing' %}
          {% set score = score - 20 %}
        {% elif anomaly == 'kritisch' %}
          {% set score = score - 40 %}
        {% endif %}

        {# Efficiency #}
        {% if efficiency < 0.05 %}
          {% set score = score - 20 %}
        {% elif efficiency < 0.15 %}
          {% set score = score - 10 %}
        {% endif %}

        {# Dryback #}
        {% if dryback == 'extreme' %}
          {% set score = score - 15 %}
        {% elif dryback == 'fast' %}
          {% set score = score - 8 %}
        {% endif %}

        {# Water demand #}
        {% if demand == 'extreme' %}
          {% set score = score - 15 %}
        {% elif demand == 'high' %}
          {% set score = score - 8 %}
        {% endif %}

        {{ [score, 0] | max }}

