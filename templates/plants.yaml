    # ==========================================
    # HUIDIG GROEISEIZOEN
    # ==========================================

    - name: Huidig Groeiseizoen

      unique_id: current_growing_season

      state: >

        {% set month = now().month %}

        {% if month in [12, 1, 2] %}
          winter

        {% elif month in [3, 4] %}
          lente

        {% elif month in [5, 6, 7, 8] %}
          piekgroei

        {% elif month in [9, 10] %}
          herfst

        {% else %}
          overgang
        {% endif %}

    # ==========================================
    # SEIZOENSFACTOR IRRIGATIE
    # ==========================================

    - name: Seizoensfactor Irrigatie

      unique_id: seasonal_irrigation_factor

      unit_of_measurement: "x"

      state: >

        {% set season =
          states('sensor.huidig_groeiseizoen')
        %}

        {% if season == 'piekgroei' %}
          1.4

        {% elif season == 'lente' %}
          1.1

        {% elif season == 'herfst' %}
          0.8

        {% elif season == 'winter' %}
          0.4

        {% else %}
          1.0
        {% endif %}

    # ==========================================
    # WEATHER STRESS LEVEL
    # ==========================================

    - name: Weather Stress Level

      unique_id: weather_stress_level

      state: >

        {% set temp =
          state_attr('weather.buienradar', 'temperature') | float(15)
        %}

        {% set humidity =
          state_attr('weather.buienradar', 'humidity') | float(70)
        %}

        {% set wind =
          state_attr('weather.buienradar', 'wind_speed') | float(0)
        %}

        {% if temp >= 28 and humidity <= 45 %}
          extreme

        {% elif temp >= 24 and wind >= 15 %}
          high

        {% elif temp >= 20 %}
          medium

        {% else %}
          low
        {% endif %}

    # ==========================================
    # WEATHER STRESS SCORE
    # ==========================================

    - name: Weather Stress Score

      unique_id: weather_stress_score

      unit_of_measurement: "WSI"

      state: >

        {% set temp =
          state_attr('weather.buienradar', 'temperature') | float(15)
        %}

        {% set humidity =
          state_attr('weather.buienradar', 'humidity') | float(70)
        %}

        {% set wind =
          state_attr('weather.buienradar', 'wind_speed') | float(0)
        %}

        {% set score =
          (
            temp * 2
            +
            ((100 - humidity) * 0.6)
            +
            (wind * 1.5)
          )
        %}

        {{ [0, [100, score] | min] | max | round(0) }}

    # ==========================================
    # ZONE 1 IRRIGATION EFFICIENCY
    # ==========================================

    - name: Zone 1 Irrigation Efficiency

      unique_id: zone_1_irrigation_efficiency

      unit_of_measurement: "%/L"

      state: >

        {% set delta =
          states('input_number.zone_1_last_delta') | float(0)
        %}

        {% set volume =
          states('input_number.zone_1_last_volume') | float(0)
        %}

        {% if volume > 0 %}
          {{ (delta / volume) | round(3) }}
        {% else %}
          0
        {% endif %}

    # ==========================================
    # ZONE 2 IRRIGATION EFFICIENCY
    # ==========================================

    - name: Zone 2 Irrigation Efficiency

      unique_id: zone_2_irrigation_efficiency

      unit_of_measurement: "%/L"

      state: >

        {% set delta =
          states('input_number.zone_2_last_delta') | float(0)
        %}

        {% set volume =
          states('input_number.zone_2_last_volume') | float(0)
        %}

        {% if volume > 0 %}
          {{ (delta / volume) | round(3) }}
        {% else %}
          0
        {% endif %}

    # ==========================================
    # RAIN ADVISORY
    # ==========================================

    - name: Rain Irrigation Advisory

      unique_id: rain_irrigation_advisory

      state: >

        {% set stress =
          states('sensor.weather_stress_level')
        %}

        {% if stress == 'low' %}
          monitor_rain

        {% elif stress == 'medium' %}
          normal

        {% elif stress == 'high' %}
          irrigate_carefully

        {% else %}
          drought_risk
        {% endif %}

    # ==========================================
    # RAIN RISK LEVEL
    # ==========================================

    - name: Rain Risk Level

      unique_id: rain_risk_level

      state: >

        {% set rain_today =
          states('sensor.home_precipitation_today') | float(0)
        %}

        {% set rain_tomorrow =
          states('sensor.home_precipitation_tomorrow') | float(0)
        %}

        {% if rain_today >= 80 or rain_tomorrow >= 80 %}
          extreme

        {% elif rain_today >= 60 or rain_tomorrow >= 60 %}
          high

        {% elif rain_today >= 40 or rain_tomorrow >= 40 %}
          medium

        {% elif rain_today >= 20 or rain_tomorrow >= 20 %}
          low

        {% else %}
          minimal
        {% endif %}

    # ==========================================
    # IRRIGATION RAIN ADVISORY
    # ==========================================

    - name: Irrigation Rain Advisory

      unique_id: irrigation_rain_advisory

      state: >

        {% set risk =
          states('sensor.rain_risk_level')
        %}

        {% if risk == 'extreme' %}
          skip_irrigation

        {% elif risk == 'high' %}
          reduce_runtime

        {% elif risk == 'medium' %}
          monitor_weather

        {% else %}
          normal_irrigation
        {% endif %}
