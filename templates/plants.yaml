# =========================
# DYNAMIC PLANT SENSORS
# =========================

- trigger:
    - platform: state
      entity_id:

        # Plant names
        - input_text.plant_1_name
        - input_text.plant_2_name
        - input_text.plant_3_name
        - input_text.plant_4_name
        - input_text.plant_5_name
        - input_text.plant_6_name
        - input_text.plant_7_name
        - input_text.plant_8_name

        # Sensor mappings
        - input_select.plant_1_sensor
        - input_select.plant_2_sensor
        - input_select.plant_3_sensor
        - input_select.plant_4_sensor
        - input_select.plant_5_sensor
        - input_select.plant_6_sensor
        - input_select.plant_7_sensor
        - input_select.plant_8_sensor

        # Moisture sensors
        - sensor.gw1200a_soil_moisture_1
        - sensor.gw1200a_soil_moisture_2
        - sensor.gw1200a_soil_moisture_3
        - sensor.gw1200a_soil_moisture_4
        - sensor.gw1200a_soil_moisture_5
        - sensor.gw1200a_soil_moisture_6
        - sensor.gw1200a_soil_moisture_7
        - sensor.gw1200a_soil_moisture_8

        # Battery sensors
        - sensor.gw1200a_soil_battery_1
        - sensor.gw1200a_soil_battery_2
        - sensor.gw1200a_soil_battery_3
        - sensor.gw1200a_soil_battery_4
        - sensor.gw1200a_soil_battery_5
        - sensor.gw1200a_soil_battery_6
        - sensor.gw1200a_soil_battery_7
        - sensor.gw1200a_soil_battery_8

  sensor:

    # =========================
    # PLANT 1
    # =========================

    - name: >
        {{ states('input_text.plant_1_name') }}

      unique_id: plant_1_moisture
      unit_of_measurement: "%"
      state_class: measurement

      state: >
        {% set s = states('input_select.plant_1_sensor') %}
        {{ states(s) | float(0) }}

    - name: >
        {{ states('input_text.plant_1_name') }} Water Status

      unique_id: plant_1_water_status

      state: >
        {% set v = states('sensor.plant_1_moisture') | float(0) %}
        {% set t = states('input_number.plant_1_target_moisture') | float(30) %}

        {% if v < t %}
          water_needed
        {% elif v < t + 8 %}
          ok
        {% else %}
          too_wet
        {% endif %}

    - name: >
        {{ states('input_text.plant_1_name') }} Priority

      unique_id: plant_1_priority

      state: >
        {% set v = states('sensor.plant_1_moisture') | float(0) %}
        {% set t = states('input_number.plant_1_target_moisture') | float(30) %}
        {% set diff = v - t %}

        {% if diff <= -10 %}
          critical

        {% elif diff <= -5 %}
          dry

        {% elif diff < 8 %}
          ok

        {% else %}
          wet
        {% endif %}

    - name: >
        {{ states('input_text.plant_1_name') }} Battery

      unique_id: plant_1_battery
      unit_of_measurement: "%"

      state: >
        {% set raw = states('sensor.gw1200a_soil_battery_1') %}

        {% if raw not in ['unknown', 'unavailable', 'none', ''] %}
          {% set v = raw | float(1.0) %}
          {{ [0, [100, ((v - 1.0) / 0.5 * 100)] | min] | max | round(0) }}
        {% else %}
          0
        {% endif %}

