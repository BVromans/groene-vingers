        {% set target = states('input_number.plant_1_target_moisture') | float(0) %}
        {% set efficiency = states('sensor.plant_1_average_efficiency') | float(0) %}

        {% set needed = target - current %}

        {% if needed <= 0 %}
          0
        {% elif efficiency > 0 %}
          {{ ((needed / efficiency) * 100) | round(0) }}
        {% else %}
